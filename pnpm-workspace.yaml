packages:
  - "apps/*"

engineStrict: true
minimumReleaseAge: 72
publicHoistPattern:
  - "pdfjs-dist"

# Security pins for transitively resolved dependencies. Ranges are restricted to
# the major they already resolve to, so no consumer receives a new major.
overrides:
  "@hono/node-server": "^1.19.17"
  "brace-expansion@5": "^5.0.12"
  "browserslist@4": "^4.29.4"
  "esbuild@0.28": "^0.28.2"
  "hono@4": "^4.13.13"
  "js-yaml@4": "^4.3.2"
  "lodash": "^4.18.1"
  "sharp": "^0.35.5"
  "tar@7": "^7.5.22"
  "undici@7": "^7.30.1"
  "undici@8": "^8.12.2"
  "valibot": "^1.4.2"
  "zod@4": "^4.6.7"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  sharp: false
  simple-git-hooks: true
  supabase: true
  workerd: true
